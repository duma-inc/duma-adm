name: Deploy Admin Portal

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-duma-adm
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/matheusffalbuquerque/duma-adm
  DEPLOYMENT: duma-adm
  CONTAINER: duma-adm

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Define a tag imutável do commit
        id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: matheusffalbuquerque
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE }}:latest
          # As NEXT_PUBLIC_* sao embutidas no bundle em tempo de build.
          # Devem espelhar o ConfigMap duma-adm-config no cluster.
          build-args: |
            NEXT_PUBLIC_API_URL=https://adm.dumaway.com/api
            NEXT_PUBLIC_KEYCLOAK_ISSUER=https://auth.dumaway.com/realms/duma-realm
            NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=duma-adm
            NEXTAUTH_URL=https://adm.dumaway.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Rollout no cluster k3s
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Aplica a nova imagem no namespace duma
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            kubectl -n duma set image deployment/${{ env.DEPLOYMENT }} \
              ${{ env.CONTAINER }}=${{ env.IMAGE }}:${{ needs.build-and-push.outputs.tag }}
            kubectl -n duma rollout status deployment/${{ env.DEPLOYMENT }} --timeout=5m
